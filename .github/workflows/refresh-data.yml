name: refresh-data

# 盘中自动刷新 ETF 期权合成期货贴水数据：
#   交易时段（北京时间 09:00–15:00）每 10 分钟跑一次 update_data.py
#   重拉新浪行情、重算贴水，提交 option_basis_data.json。
#   站点「⟳ 刷新数据」按钮拉取该 JSON（同源，无防盗链），即可拿到最新快照。
#
# 说明：
# - cron 为 UTC（GitHub Actions 规定），北京时间 = UTC+8，故 01:00–07:00 UTC = 09:00–15:00 CST
# - 提交仅含 option_basis_data.json，不会触碰看板 HTML
# - 也可在 Actions 页手动触发（workflow_dispatch）做即时刷新/自检

on:
  schedule:
    - cron: '*/10 1-7 * * 1-5'   # 周一至五 UTC 01:00-07:59 每 10 分钟
  workflow_dispatch:              # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install --quiet requests

      - name: Regenerate option_basis_data.json
        run: python update_data.py

      - name: Commit & push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add option_basis_data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 刷新贴水数据 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main
