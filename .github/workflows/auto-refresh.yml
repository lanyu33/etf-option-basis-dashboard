name: auto-refresh

# 测试：全新文件名能否让 GitHub schedule 重新注册并触发
# （排除"一直用 Contents API 修改 refresh-data.yml 导致其 schedule 注册失效"的可能）
# cron 先用全天每 5 分钟验证触发；验证成功后改回交易时段（周一至五 09:00-15:00 CST）
#
# 说明：
# - cron 为 UTC；提交仅含 option_basis_data.json
# - 若本测试文件 schedule 能触发，则把 refresh-data.yml 的 schedule 移除，统一用本文件

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install --quiet requests

      - name: Regenerate option_basis_data.json
        run: python update_data.py

      - name: Commit & push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add option_basis_data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 刷新贴水数据 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main
